name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    name: Catalog regeneration matches committed cards.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          curl -sSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlinc
      - name: Regenerate catalog from card table
        run: |
          /tmp/kotlinc/kotlinc/bin/kotlinc -script tools/build_catalog.kts \
            shared-data/card_table.txt /tmp/cards.json shared-data/react_cards.json
      - name: Diff against committed catalog (byte-identical or fail)
        run: diff /tmp/cards.json shared-data/catalog/cards.json

  jvm:
    name: JVM tests (Kotlin core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew :core:test --console=plain --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports-${{ github.sha }}
          path: core/build/test-results/test/*.xml
          if-no-files-found: ignore

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain --no-daemon
      - name: Upload APK artifact
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "Triad-debug-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Triad-debug-APK
          path: Triad-debug-*.apk
          if-no-files-found: error

  release:
    name: Release APK (on v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain --no-daemon
      - name: Name APK after the tag
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "Triad-${GITHUB_REF_NAME}.apk"
      - name: Create or update GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Triad-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Triad-${GITHUB_REF_NAME}.apk" --generate-notes --title "Triad $GITHUB_REF_NAME"
          fi

  swift:
    name: Swift tests (TriadCore)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run TriadCore tests
        working-directory: ios/TriadCore
        run: swift test
